[package]
name = "agentic-rtb-framework-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agentic-rtb-framework-service"
path = "src/main.rs"


[dependencies]
tonic = "0.14.2"
tonic-prost = "0.14.2"
hyper = { version = "0.14.32", features = ["http1", "server", "tcp"] }
prost = "0.14.1"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true  # Enable link-time optimization.
codegen-units = 1  # Use a single codegen unit to reduce binary size.
